        body {

        /* High-quality Minecraft Shaders Background */
        body::after {
            content: '';
            position: fixed;

            z-index: -2;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(#22d3ee 0.8px, transparent 0.8px),

            opacity: 0.05;
            pointer-events: none;
            z-index: -1;
        }

        .title-font { font-family: 'Space Grotesk', sans-serif; }
        
        .mod-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(24, 24, 27, 0.95);
            border: 1px solid rgba(163, 163, 163, 0.1);
        }
        .mod-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px -12px rgb(16 185 129 / 0.25);
            border-color: rgb(163 163 163 / 0.3);
        }

        .mod-name {
            font-size: 1.35rem;
            line-height: 1.25;
        }
    </style>

                "version": "2.15.2+1.21.11"
            },
            {
                "name": "essential-container",
                "url": "https://modrinth.com/mod/k2ZPuTBm",
                "version": "1.0.0"
            },
            {
                "authors": ["kennytv"],
                "name": "kennytv's epic force close loading screen mod for Fabric",
                "url": "https://modrinth.com/mod/blWBX5n1",
                "version": "2.3.4"
            }
        ];

        let iconCache = {};

        function getModId(url) {
            if (!url) return null;
            const match = url.match(/modrinth\.com\/mod\/([a-zA-Z0-9_-]+)/);
            return match ? match[1] : null;
        }

        async function loadIconCache() {
            try {
                const res = await fetch('icons.json', { cache: 'no-cache' });
                if (res.ok) iconCache = await res.json();
            } catch (e) {}
        }

        async function getIconUrl(modId) {
            if (!modId) return null;
            if (iconCache[modId]) return iconCache[modId];

            try {
                const res = await fetch(`https://api.modrinth.com/v2/project/${modId}`);
                if (!res.ok) return null;
                const data = await res.json();
                const iconUrl = data.icon_url;
                if (iconUrl) iconCache[modId] = iconUrl;
                return iconUrl;
            } catch (e) {
                return null;
            }
        }

        async function renderMods(modList) {
            const container = document.getElementById('mods-container');
            container.innerHTML = '';
            const statusEl = document.getElementById('status');

            for (const mod of modList) {
                const authors = Array.isArray(mod.authors) ? mod.authors.join(', ') : (mod.authors || 'Unknown');
                const modId = getModId(mod.url);

                const card = document.createElement('div');
                card.className = `mod-card rounded-3xl overflow-hidden h-full flex flex-col relative`;

                card.innerHTML = `
                    <div class="p-6 flex-1">
                        <div class="flex gap-5">
                            <div class="w-16 h-16 bg-zinc-800 rounded-2xl overflow-hidden flex-shrink-0 border border-zinc-700">
                                <img src="modrinth_logo.webp" 
                                     alt="${mod.name}" 
                                     class="w-full h-full object-cover">
                            </div>
                            <div class="flex-1 min-w-0">
                                <a href="${mod.url || '#'}" target="_blank"
                                   class="mod-name block font-semibold title-font tracking-tight hover:text-emerald-400 transition-colors line-clamp-2">
                                    ${mod.name}
                                </a>
                                <p class="text-zinc-400 mt-3 text-sm line-clamp-2">${authors}</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-auto border-t border-zinc-800 px-6 py-4">
                        <a href="${mod.url || '#'}" target="_blank"
                           class="flex items-center justify-center gap-2 text-emerald-400 hover:text-emerald-300 transition-colors text-sm font-medium">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            Modrinth
                        </a>
                    </div>
                `;
                container.appendChild(card);

                if (modId) {
                    const iconUrl = await getIconUrl(modId);
                    if (iconUrl) {
                        const img = card.querySelector('img');
                        img.src = iconUrl;
                    }
                }
            }
        }

        function updateStats() {
            document.getElementById('mod-count').textContent = mods.length;
            const authors = new Set();
            mods.forEach(mod => {
                if (Array.isArray(mod.authors)) mod.authors.forEach(a => authors.add(a));
                else if (mod.authors) authors.add(mod.authors);
            });
            document.getElementById('author-count').textContent = authors.size;
        }

        window.onload = async () => {
            await loadIconCache();
            renderMods(mods);
            updateStats();
        };
    </script>
</body>
</html>
